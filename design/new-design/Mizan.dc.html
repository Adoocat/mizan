html,body{margin:0;padding:0;background:var(--m-f3f1ec-bg);color:var(--m-1c1b19-fg);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;}
*{box-sizing:border-box}
a{color:var(--m-2c4a7c-fg);text-decoration:none}a:hover{color:var(--m-1f3760-fg);text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-feature-settings:"tnum" 1}
::selection{background:var(--m-d9e2f0-bg)}
input[type=range]{accent-color:var(--m-2c4a7c-bg)}
@keyframes mzToast{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes mzFade{from{opacity:0}to{opacity:1}}
@keyframes mzSpin{to{transform:rotate(360deg)}}
@keyframes mzRise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

<div style="display:flex;height:100vh;overflow:hidden;background:var(--m-f3f1ec-bg)">
  <aside style="width:236px;flex:none;display:flex;flex-direction:column;background:var(--m-f3f1ec-bg)">
    <div style="height:76px;display:flex;align-items:center;gap:10px;padding:0 22px;flex:none">
      <div style="width:26px;height:26px;border-radius:7px;background:var(--m-101417-bg);border:1px solid var(--m-232a2f-line);display:flex;align-items:center;justify-content:center;flex:none"><svg viewBox="0 0 176 186" style="width:15px;height:16px;display:block"><path d="M8 6 L68 51 L68 178 L8 136 Z" style="fill:var(--m-5a9e96-bg);stroke:var(--m-5a9e96-line);stroke-width:8;stroke-linejoin:round"></path><path d="M168 6 L168 136 L112 178 L112 106 C112 96 100 92 100 82 L100 54 Z" style="fill:var(--m-84cdb8-bg);stroke:var(--m-84cdb8-line);stroke-width:8;stroke-linejoin:round"></path></svg></div>
      <a href="Mizan Landing.dc.html" style="font-size:19px;font-weight:500;letter-spacing:-0.045em;color:var(--m-1c1b19-fg);text-decoration:none">Mizan</a>
      <button style="all:unset;cursor:pointer;margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--m-5c5852-fg);border:1px solid var(--m-dedad1-line);border-radius:999px;padding:2px 9px" style-hover="border-color:var(--m-cfcac0-line)">Personal<span style="font-size:8px;color:var(--m-8a857c-fg)">▼</span></button>
    </div>
    <nav style="flex:1;overflow:auto;padding-bottom:12px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:1px;padding:0 12px;margin-top:14px">
          <sc-if value="{{ g.hasLabel }}" hint-placeholder-val="{{ false }}">
            <div style="font-size:11px;color:var(--m-8a857c-fg);padding:8px 8px 4px;font-weight:500;letter-spacing:0.01em">{{ g.label }}</div>
          </sc-if>
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
            <button onClick="{{ it.onClick }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:12px;font-size:13.5px;border:1px solid {{ it.bd }};background:{{ it.bg }};color:{{ it.color }};font-weight:{{ it.weight }};box-shadow:{{ it.shadow }};transition:background 120ms" style-hover="background:{{ it.hbg }}">
              <span style="width:5px;height:5px;border-radius:1px;background:{{ it.dot }};flex:none"></span>
              <span style="flex:1">{{ it.label }}</span>
              <span style="font-size:11.5px;color:{{ it.metaColor }};font-weight:500">{{ it.meta }}</span>
            </button>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="flex:none;padding:12px 12px 18px;display:flex;flex-direction:column;gap:2px">
      <button onClick="{{ goAccounts }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:8px;border-radius:6px" style-hover="background:var(--m-eae7e0-bg)">
        <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--m-4f4b45-fg)"><span style="width:6px;height:6px;border-radius:50%;background:var(--m-2f7d57-bg)"></span>7 of 8 connections synced</div>
        <div style="font-size:11.5px;color:var(--m-a86f12-fg);padding-left:13px">İş Bankası needs re-authorisation</div>
      </button>
      <div style="display:flex;align-items:center;gap:8px">
        <button style="all:unset;cursor:pointer;flex:1;display:flex;align-items:center;height:30px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--m-4f4b45-fg)" style-hover="background:var(--m-eae7e0-bg)">Settings</button>
        <div style="display:flex;gap:2px;padding:2px;background:var(--m-ece9e2-bg);border:1px solid var(--m-e7e4dd-line);border-radius:6px">
          <sc-for list="{{ themes }}" as="t" hint-placeholder-count="2"><button onClick="{{ t.pick }}" style="all:unset;cursor:pointer;padding:3px 8px;border-radius:4px;font-size:11.5px;font-weight:500;background:{{ t.bg }};color:{{ t.color }};box-shadow:{{ t.shadow }}">{{ t.label }}</button></sc-for>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:9px;padding:6px 8px 0">
        <div style="width:26px;height:26px;border-radius:50%;background:var(--m-e2ded5-bg);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--m-4f4b45-fg)">EK</div>
        <div style="display:flex;flex-direction:column;line-height:1.25">
          <span style="font-size:12.5px;font-weight:500">Elif Kaya</span>
          <span style="font-size:11px;color:var(--m-77726a-fg)">elif.kaya@posta.com</span>
        </div>
      </div>
    </div>
  </aside>

  <div ref="{{ mainRef }}" style="flex:1;min-width:0;display:flex;flex-direction:column;background:var(--m-f3f1ec-bg)">
    <header style="height:76px;flex:none;display:flex;align-items:center;gap:10px;padding:0 28px 0 40px;background:var(--m-f3f1ec-bg);overflow:hidden">
      <sc-if value="{{ showSearch }}" hint-placeholder-val="{{ true }}">
        <div style="flex:1 1 200px;min-width:120px;max-width:420px;height:40px;display:flex;align-items:center;gap:10px;padding:0 16px;border:1px solid transparent;border-radius:999px;background:var(--m-ffffff-bg);color:var(--m-77726a-fg);font-size:13px">
          <span style="width:9px;height:9px;border:1.5px solid var(--m-8a857c-line);border-radius:50%;flex:none"></span>
          <span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Search transactions, accounts, goals…</span>
          <span style="font-family:'Geist Mono',monospace;font-size:11px;border:1px solid var(--m-e3e0d8-line);border-radius:4px;padding:0 5px;color:var(--m-8a857c-fg)">⌘K</span>
        </div>
      </sc-if>
      <sc-if value="{{ searchIcon }}" hint-placeholder-val="{{ false }}">
        <button title="Search (⌘K)" style="flex:none;width:40px;height:40px;border:1px solid transparent;background:var(--m-ffffff-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer"><span style="width:9px;height:9px;border:1.5px solid var(--m-8a857c-line);border-radius:50%"></span></button>
      </sc-if>
      <div style="flex:1;min-width:0"></div>
      <sc-if value="{{ showMonth }}" hint-placeholder-val="{{ true }}">
        <div style="flex:none;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--m-5c5852-fg);white-space:nowrap">
          <span style="font-weight:500;color:var(--m-1c1b19-fg)">October 2026</span>
          <span style="width:56px;height:3px;background:var(--m-e7e4dd-bg);border-radius:2px;overflow:hidden;display:inline-flex"><span style="width:71%;background:var(--m-5c5852-bg)"></span></span>
          <span>10 days left</span>
        </div>
        <div style="flex:none;width:1px;height:20px;background:var(--m-e3e0d8-bg);margin:0 6px"></div>
      </sc-if>
      <button onClick="{{ goWhatIf }}" style="flex:none;height:40px;padding:0 18px;border:1px solid transparent;background:var(--m-ffffff-bg);border-radius:999px;font-size:13px;color:var(--m-1c1b19-fg);cursor:pointer;white-space:nowrap" style-hover="background:var(--m-f3f1ec-bg)">What-if</button>
      <button onClick="{{ toggleA }}" style="flex:none;height:40px;padding:0 14px 0 18px;border:1px solid {{ askBd }};background:{{ askBg }};border-radius:999px;font-size:13px;color:var(--m-1c1b19-fg);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap" style-hover="background:var(--m-f3f1ec-bg)">Ask <span style="font-family:'Geist Mono',monospace;font-size:11px;color:var(--m-8a857c-fg)">⌘J</span></button>
      <button onClick="{{ openAdd }}" title="Add transaction" style="flex:none;height:40px;padding:0 20px;border:1px solid var(--m-1c1b19-line);background:var(--m-1c1b19-bg);color:var(--m-faf9f6-fg);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--m-33312d-bg)">{{ addLabel }}</button>
    </header>
    <main ref="{{ scrollRef }}" style="flex:1;overflow:auto">
      <sc-if value="{{ is.dashboard }}" hint-placeholder-val="{{ true }}"><dc-import name="Dashboard" go="{{ go }}" ask="{{ ask }}" notify="{{ notify }}" hint-size="100%,1600px"></dc-import></sc-if>
      <sc-if value="{{ is.plan }}" hint-placeholder-val="{{ false }}"><dc-import name="Plan" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1600px"></dc-import></sc-if>
      <sc-if value="{{ is.transactions }}" hint-placeholder-val="{{ false }}"><dc-import name="Transactions" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1200px"></dc-import></sc-if>
      <sc-if value="{{ is.calendar }}" hint-placeholder-val="{{ false }}"><dc-import name="Calendar" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1100px"></dc-import></sc-if>
      <sc-if value="{{ is.savings }}" hint-placeholder-val="{{ false }}"><dc-import name="Savings" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1400px"></dc-import></sc-if>
      <sc-if value="{{ is.investments }}" hint-placeholder-val="{{ false }}"><dc-import name="Investments" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1800px"></dc-import></sc-if>
      <sc-if value="{{ is.goals }}" hint-placeholder-val="{{ false }}"><dc-import name="Goals" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1200px"></dc-import></sc-if>
      <sc-if value="{{ is.debts }}" hint-placeholder-val="{{ false }}"><dc-import name="Debts" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1200px"></dc-import></sc-if>
      <sc-if value="{{ is.networth }}" hint-placeholder-val="{{ false }}"><dc-import name="NetWorth" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1200px"></dc-import></sc-if>
      <sc-if value="{{ is.reports }}" hint-placeholder-val="{{ false }}"><dc-import name="Reports" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1600px"></dc-import></sc-if>
      <sc-if value="{{ is.accounts }}" hint-placeholder-val="{{ false }}"><dc-import name="Accounts" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1200px"></dc-import></sc-if>
      <sc-if value="{{ is.whatif }}" hint-placeholder-val="{{ false }}"><dc-import name="WhatIf" go="{{ go }}" notify="{{ notify }}" hint-size="100%,1200px"></dc-import></sc-if>
    </main>
  </div>

  <sc-if value="{{ assistant }}" hint-placeholder-val="{{ false }}">
    <div style="width:392px;flex:none;height:calc(100vh - 24px);margin:12px 12px 12px 0;border-radius:24px;overflow:hidden;background:var(--m-ffffff-bg);animation:mzFade 160ms ease-out">
      <dc-import name="Assistant" on-close="{{ toggleA }}" question="{{ assistantQ }}" go="{{ go }}" hint-size="380px,100%" style="width:100%;height:100%"></dc-import>
    </div>
  </sc-if>
</div>

<sc-if value="{{ add }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeAdd }}" style="position:fixed;inset:0;background:rgba(28,27,25,0.28);display:flex;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50;animation:mzFade 120ms ease-out">
    <div onClick="{{ stop }}" style="width:460px;max-width:calc(100vw - 32px);background:var(--m-ffffff-bg);border:1px solid var(--m-e3e0d8-line);border-radius:24px;box-shadow:0 24px 60px rgba(0,0,0,0.28);animation:mzRise 160ms ease-out">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0">
        <div style="font-size:15px;font-weight:600;letter-spacing:-0.01em">Add transaction</div>
        <button onClick="{{ closeAdd }}" style="all:unset;cursor:pointer;font-size:12px;color:var(--m-77726a-fg);font-family:'Geist Mono',monospace;border:1px solid var(--m-e3e0d8-line);border-radius:4px;padding:1px 6px">esc</button>
      </div>
      <div style="padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;gap:2px;padding:2px;background:var(--m-f3f1ec-bg);border-radius:6px;width:max-content">
          <sc-for list="{{ types }}" as="t" hint-placeholder-count="3">
            <button onClick="{{ t.onClick }}" style="all:unset;cursor:pointer;padding:5px 12px;border-radius:5px;font-size:12.5px;background:{{ t.bg }};color:{{ t.color }};box-shadow:{{ t.shadow }};font-weight:500">{{ t.label }}</button>
          </sc-for>
        </div>
        <label style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:12px;color:var(--m-5c5852-fg);font-weight:500">Amount</span>
          <div style="display:flex;align-items:center;gap:6px;height:52px;padding:0 14px;border:1px solid var(--m-2c4a7c-line);border-radius:6px;box-shadow:0 0 0 3px var(--m-e3e9f3-line)">
            <span style="font-size:22px;color:var(--m-77726a-fg)">₺</span>
            <input value="{{ amount }}" onChange="{{ setAmount }}" placeholder="0.00" autofocus="" style="all:unset;flex:1;font-size:24px;font-weight:500;letter-spacing:-0.02em">
          </div>
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <label style="display:flex;flex-direction:column;gap:6px;grid-column:1 / -1">
            <span style="font-size:12px;color:var(--m-5c5852-fg);font-weight:500">Merchant or description</span>
            <input value="{{ merchant }}" onChange="{{ setMerchant }}" placeholder="e.g. Migros Kadıköy" style="height:36px;padding:0 10px;border:1px solid var(--m-dedad1-line);border-radius:6px;font-size:13px;outline:none;color:var(--m-1c1b19-fg)">
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:12px;color:var(--m-5c5852-fg);font-weight:500">Category</span>
            <select value="{{ category }}" onChange="{{ setCategory }}" style="height:36px;padding:0 8px;border:1px solid var(--m-dedad1-line);border-radius:6px;font-size:13px;background:var(--m-ffffff-bg);color:var(--m-1c1b19-fg)">
              <option>Food &amp; groceries</option><option>Dining out</option><option>Transport</option><option>Shopping</option><option>Personal care</option><option>Utilities</option>
            </select>
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:12px;color:var(--m-5c5852-fg);font-weight:500">Account</span>
            <select style="height:36px;padding:0 8px;border:1px solid var(--m-dedad1-line);border-radius:6px;font-size:13px;background:var(--m-ffffff-bg);color:var(--m-1c1b19-fg)">
              <option>Garanti BBVA ··4471</option><option>Bonus Card ··9020</option><option>Cash wallet</option>
            </select>
          </label>
          <label style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:12px;color:var(--m-5c5852-fg);font-weight:500">Date</span>
            <input value="22 Oct 2026" readonly="" style="height:36px;padding:0 10px;border:1px solid var(--m-dedad1-line);border-radius:6px;font-size:13px;color:var(--m-1c1b19-fg)">
          </label>
          <div style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:12px;color:var(--m-5c5852-fg);font-weight:500">Budget impact</span>
            <div style="height:36px;display:flex;align-items:center;font-size:12.5px;color:var(--m-5c5852-fg)">{{ impact }}</div>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--m-efece6-line);background:var(--m-faf9f6-bg);border-radius:0 0 24px 24px">
        <button onClick="{{ closeAdd }}" style="height:32px;padding:0 14px;border:1px solid var(--m-dedad1-line);background:var(--m-ffffff-bg);border-radius:6px;font-size:13px;cursor:pointer" style-hover="background:var(--m-f3f1ec-bg)">Cancel</button>
        <button onClick="{{ saveAdd }}" style="height:32px;padding:0 14px;border:1px solid var(--m-1c1b19-line);background:var(--m-1c1b19-bg);color:var(--m-faf9f6-fg);border-radius:6px;font-size:13px;font-weight:500;cursor:pointer" style-hover="background:var(--m-33312d-bg)">Save transaction</button>
      </div>
    </div>
  </div>
</sc-if>

<sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--m-tip);color:var(--m-tip-fg);border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(28,27,25,0.18);animation:mzToast 180ms ease-out;white-space:nowrap">
    <span style="width:16px;height:16px;border-radius:50%;background:var(--m-2f7d57-bg);display:flex;align-items:center;justify-content:center;font-size:10px">✓</span>
    {{ toast }}
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dark&quot;,&quot;Light&quot;],&quot;default&quot;:&quot;Dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dashboard&quot;,&quot;Plan&quot;,&quot;Transactions&quot;,&quot;Calendar&quot;,&quot;Savings&quot;,&quot;Investments&quot;,&quot;Goals&quot;,&quot;Debts&quot;,&quot;Net Worth&quot;,&quot;Reports&quot;,&quot;Accounts&quot;,&quot;What-if&quot;],&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;assistantOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const NAV = [
  { label: null, items: [['dashboard', 'Dashboard'], ['plan', 'Plan'], ['transactions', 'Transactions', '4', 'var(--m-77726a-bg)'], ['calendar', 'Calendar', '1', 'var(--m-b4423a-bg)']] },
  { label: 'Wealth', items: [['savings', 'Savings'], ['investments', 'Investments'], ['goals', 'Goals'], ['debts', 'Debts'], ['networth', 'Net Worth']] },
  { label: 'Review', items: [['reports', 'Reports'], ['accounts', 'Accounts', '1', 'var(--m-a86f12-bg)']] },
  { label: 'Tools', items: [['whatif', 'What-if simulator']] },
];
const START = { Dashboard: 'dashboard', Plan: 'plan', Transactions: 'transactions', Calendar: 'calendar', Savings: 'savings', Investments: 'investments', Goals: 'goals', Debts: 'debts', 'Net Worth': 'networth', Reports: 'reports', Accounts: 'accounts', 'What-if': 'whatif' };

class Component extends DCLogic {
  state = { theme: 'dark', screen: 'dashboard', assistant: false, assistantQ: null, add: false, toast: null, type: 'Expense', amount: '', merchant: '', category: 'Food & groceries' };
  scrollRef = React.createRef();
  mainRef = React.createRef();

  componentDidMount() {
    let saved = null; try { saved = localStorage.getItem('mizan-theme'); } catch (e) {}
    this.applyTheme(saved || (this.props.theme || 'Dark').toLowerCase(), false);
    this.ro = new ResizeObserver(([e]) => { const w = Math.round(e.contentRect.width); if (w !== this.state.mw) this.setState({ mw: w }); });
    if (this.mainRef.current) this.ro.observe(this.mainRef.current);
    this.setState({ screen: START[this.props.startScreen] || 'dashboard', assistant: !!this.props.assistantOpen });
    this.onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); this.toggleA(); }
      if (e.key === 'Escape') this.setState({ add: false });
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentDidUpdate(prev) {
    if (prev.theme !== this.props.theme && this.props.theme) this.applyTheme(this.props.theme.toLowerCase());
    if (prev.startScreen !== this.props.startScreen) this.go(START[this.props.startScreen] || 'dashboard');
    if (prev.assistantOpen !== this.props.assistantOpen) this.setState({ assistant: !!this.props.assistantOpen });
  }
  componentWillUnmount() { this.ro && this.ro.disconnect(); window.removeEventListener('keydown', this.onKey); clearTimeout(this.tt); }

  applyTheme = (t, persist = true) => { document.documentElement.dataset.theme = t; this.setState({ theme: t }); if (persist) { try { localStorage.setItem('mizan-theme', t); } catch (e) {} } };
  go = (s) => { this.setState({ screen: s }); if (this.scrollRef.current) this.scrollRef.current.scrollTop = 0; };
  toggleA = () => this.setState((s) => ({ assistant: !s.assistant, assistantQ: null }));
  ask = (q) => this.setState({ assistant: true, assistantQ: q });
  notify = (msg) => { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: null }), 2600); };

  renderVals() {
    const s = this.state.screen;
    const groups = NAV.map((g) => ({
      label: g.label, hasLabel: !!g.label,
      items: g.items.map(([id, label, meta, mc]) => {
        const a = id === s;
        return {
          label, meta: meta || '', metaColor: mc || 'var(--m-77726a-fg)',
          bg: a ? 'var(--m-ffffff-bg)' : 'transparent', hbg: a ? 'var(--m-ffffff-bg)' : 'var(--m-eae7e0-bg)', bd: 'transparent',
          color: a ? 'var(--m-1c1b19-fg)' : 'var(--m-4f4b45-fg)', weight: a ? 500 : 400, dot: a ? 'var(--m-2c4a7c-bg)' : 'transparent',
          shadow: 'none', onClick: () => this.go(id),
        };
      }),
    }));
    const is = {}; Object.values(START).forEach((k) => { is[k] = k === s; });
    const amt = parseFloat(String(this.state.amount).replace(/,/g, '')) || 0;
    const left = { 'Food & groceries': 1150, 'Dining out': 3000, Transport: 380, Shopping: 3000, 'Personal care': -110, Utilities: 330 }[this.state.category];
    const after = left - (this.state.type === 'Expense' ? amt : 0);
    const fmt = (n) => (n < 0 ? '−₺' : '₺') + Math.abs(Math.round(n)).toLocaleString('en-US');
    return {
      themes: [['dark', 'Dark'], ['light', 'Light']].map(([id, label]) => { const a = this.state.theme === id; return { label, bg: a ? 'var(--m-ffffff-bg)' : 'transparent', color: a ? 'var(--m-1c1b19-fg)' : 'var(--m-77726a-fg)', shadow: a ? '0 1px 2px rgba(28,27,25,0.10)' : 'none', pick: () => this.applyTheme(id) }; }),
      mainRef: this.mainRef,
      showMonth: (this.state.mw || 1200) >= 860, showSearch: (this.state.mw || 1200) >= 560, searchIcon: (this.state.mw || 1200) < 560,
      addLabel: (this.state.mw || 1200) < 420 ? '+ Add' : 'Add transaction',
      groups, is, assistant: this.state.assistant, assistantQ: this.state.assistantQ, toast: this.state.toast, add: this.state.add,
      askBg: this.state.assistant ? 'var(--m-f3f1ec-bg)' : 'var(--m-ffffff-bg)', askBd: this.state.assistant ? 'var(--m-cfcac0-line)' : 'transparent',
      scrollRef: this.scrollRef, go: this.go, ask: this.ask, notify: this.notify, toggleA: this.toggleA,
      goWhatIf: () => this.go('whatif'), goAccounts: () => this.go('accounts'),
      openAdd: () => this.setState({ add: true, amount: '', merchant: '' }),
      closeAdd: () => this.setState({ add: false }), stop: (e) => e.stopPropagation(),
      types: ['Expense', 'Income', 'Transfer'].map((t) => ({ label: t, bg: t === this.state.type ? 'var(--m-ffffff-bg)' : 'transparent', color: t === this.state.type ? 'var(--m-1c1b19-fg)' : 'var(--m-5c5852-fg)', shadow: t === this.state.type ? '0 1px 2px rgba(28,27,25,0.08)' : 'none', onClick: () => this.setState({ type: t }) })),
      amount: this.state.amount, merchant: this.state.merchant, category: this.state.category,
      setAmount: (e) => this.setState({ amount: e.target.value.replace(/[^0-9.,]/g, '') }),
      setMerchant: (e) => this.setState({ merchant: e.target.value }),
      setCategory: (e) => this.setState({ category: e.target.value }),
      impact: this.state.type === 'Expense' ? `${this.state.category}: ${fmt(left)} → ${fmt(after)} left` : 'No budget impact',
      saveAdd: () => { this.setState({ add: false }); this.notify(`Saved · ${this.state.merchant || 'Transaction'} · ${fmt(amt)} · ${this.state.category}`); },
    };
  }
}
</script>
</body>
</html>
